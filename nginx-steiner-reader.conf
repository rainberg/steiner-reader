server {
    listen 80;
    server_name steiner.3mudi.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name steiner.3mudi.com;

    ssl_certificate /etc/letsencrypt/live/steiner.3mudi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/steiner.3mudi.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;

    client_max_body_size 100m;

    # Remote Dev API
    location /dev/api/ {
        proxy_pass http://127.0.0.1:9000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Backend routes
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://127.0.0.1:8000;
    }

    # New frontend - static assets (hashed filenames, long cache)
    location /v2/assets/ {
        alias /opt/steiner-reader/frontend-new/dist/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # New frontend - SPA routes
    location /v2/ {
        alias /opt/steiner-reader/frontend-new/dist/;
        index index.html;
        try_files $uri $uri/ /v2/index.html;
    }

    # Frontend (everything else → old Next.js)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
